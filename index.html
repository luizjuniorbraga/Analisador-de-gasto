<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Viewport: garante bom comportamento em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Gastos</title>
    <!-- Folha de estilos (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Analisador de Gastos</h1>

        <!-- Resumo: mostra o total gasto e a quantidade de gastos cadastrados -->
        <section class="resumo">
            <div class="cartao-resumo">
                <span class="rotulo">Total gasto</span>
                <span id="totalGasto" class="valor">R$ 0,00</span>
            </div>
            <div class="cartao-resumo">
                <span class="rotulo">Gastos cadastrados</span>
                <span id="quantidadeGastos" class="valor">0</span>
            </div>
        </section>

        <!-- Formulário de entrada de dados -->
        <form id="formulario" autocomplete="off">
            <div class="campo">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    name="descricao"
                    placeholder="Ex: Supermercado Frutas Lanches"
                    required
                >
            </div>

            <div class="campo">
                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    name="valor"
                    placeholder="0,00"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>

            <div class="campo">
                <label for="data">Data (opcional)</label>
                <input
                    type="date"
                    id="data"
                    name="data"
                >
            </div>

            <button type="submit" id="botaoAdicionar">Adicionar</button>
        </form>

        <!-- Mensagem de erro/validação -->
        <p id="mensagemErro" class="erro" hidden></p>

        <!-- Filtro por período -->
        <section class="filtro">
            <label for="filtroMes">Filtrar por período</label>
            <select id="filtroMes">
                <option value="todos">Todos os meses</option>
                <option value="atual">Mês atual</option>
                <option value="passado">Mês passado</option>
            </select>
        </section>

        <!-- Lista de gastos -->
        <section id="listaGastos" class="lista-gastos">
            <!-- Os itens são gerados aqui pelo JavaScript -->
        </section>
    </main>

    <!-- Script da aplicação -->
    <script src="script.js"></script>
</body>
</html>
